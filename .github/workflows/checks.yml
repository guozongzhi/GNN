name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            demo/requirements-lock.txt
            tools/requirements.txt
      - name: Install CPU runtime and browser
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r demo/requirements-lock.txt -r tools/requirements.txt playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Verify original evidence
        run: python tools/verify-sources.py
      - name: Test training and evidence tools
        run: |
          python -m unittest discover -s demo -p 'test_*.py'
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Build and check the offline guide
        run: |
          python tools/build-guide.py
          git diff --exit-code -- outputs/gnn-guide.html source/paper-index.md
          python tools/check-browser.py
      - name: Train, reload and check an independent report
        run: |
          python demo/train.py --epochs 30 --seeds 7 --data-seed 42 --out runs/ci
          python demo/train.py --evaluate runs/ci/gcn-7.pt --out runs/ci-evaluation
          python tools/check-report.py runs/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: experiment-and-browser-checks
          path: |
            runs/ci/
            runs/ci-evaluation/
            outputs/browser-checks.json
          retention-days: 7
