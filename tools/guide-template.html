<style>
:root{--ink:#17302f;--muted:#526762;--paper:#f6f7f2;--line:#d6ded7;--accent:#12675e;--warm:#a94b20;--white:#fff;--soft:#e8f0e9}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.85 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}a{color:var(--accent);text-underline-offset:4px}a:hover{color:var(--warm)}.mast{border-bottom:1px solid var(--line);display:flex;justify-content:space-between;padding:18px 5vw;font-size:12px;letter-spacing:.1em}.mast a{text-decoration:none}.hero{max-width:1150px;margin:0 auto;padding:70px 28px 45px;display:grid;grid-template-columns:1.5fr 1fr;align-items:center;gap:25px}.eyebrow{font:12px/1.5 ui-monospace,monospace;letter-spacing:.13em;color:var(--accent)}h1{font-size:clamp(40px,5.2vw,70px);letter-spacing:-.045em;line-height:1.19;margin:20px 0 24px}.hero p{max-width:560px;color:var(--muted);font-size:18px}.hero-art{width:100%;height:auto}.pills{display:flex;gap:9px;flex-wrap:wrap}.pill{border:1px solid var(--line);padding:4px 12px;border-radius:30px;font-size:12px}.layout{max-width:1240px;margin:auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:44px;padding:20px 28px 80px}.sidebar{align-self:start;position:sticky;top:22px;border-top:2px solid var(--ink);padding-top:12px}.sidebar a{display:block;color:var(--muted);text-decoration:none;font-size:13px;padding:6px 0;line-height:1.6}.sidebar a:hover{color:var(--accent)}article{min-width:0}article>h1,article>blockquote:first-of-type{display:none}h2{font-size:27px;line-height:1.5;margin:65px 0 20px;letter-spacing:-.025em;border-top:1px solid var(--line);padding-top:26px;scroll-margin-top:20px}article>h2:first-of-type{margin-top:0}h3{font-size:20px;margin-top:32px}p{margin:17px 0}strong{font-weight:650}table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.75;margin:22px 0;display:table}th,td{border-bottom:1px solid var(--line);padding:12px 10px;text-align:left;vertical-align:top}th{background:var(--soft);font-size:12px;letter-spacing:.04em}td:first-child{min-width:85px}pre{background:#173d37;color:#edf8ee;padding:22px;border-radius:8px;overflow:auto;font:13px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.85em}p code,li code,td code{background:var(--soft);padding:2px 4px;border-radius:4px;overflow-wrap:anywhere}li{margin:9px 0}blockquote{border-left:3px solid var(--accent);padding-left:20px;color:var(--muted)}.lab{border:1px solid #b9cdc1;border-radius:14px;margin:30px 0;overflow:hidden;background:var(--white)}.lab-top{background:var(--soft);padding:20px 24px}.lab-top h3{margin:0;font-size:22px}.lab-top p{margin:5px 0 0;font-size:13px;color:var(--muted)}.lab-body{padding:22px;display:grid;grid-template-columns:1.15fr 1fr;gap:22px}.graph{width:100%;height:auto;background:#f7faf5;border-radius:8px}.graph .edge{stroke:#b5c5ba;stroke-width:2}.graph .edge.active{stroke:var(--accent);stroke-width:4}.node{cursor:pointer;outline:none}.node:focus circle{stroke:#a94b20;stroke-width:5}.node circle{stroke:#fff;stroke-width:3;transition:fill .25s}.node.chosen circle{stroke:var(--ink);stroke-width:4}.node text{pointer-events:none;font-size:15px;font-weight:650}.node .number{font-size:12px;font-family:ui-monospace,monospace}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px;font-size:13px}button,select{font:inherit;border:1px solid #9caf9f;border-radius:5px;background:white;color:var(--ink);padding:7px 11px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.4;cursor:default}input[type=range]{accent-color:var(--accent);width:130px}input[type=checkbox]{accent-color:var(--accent)}.explain{font-size:13px;line-height:1.75}.explain h4{margin:2px 0 12px;font-size:17px}.equation{font:16px/1.65 ui-monospace,monospace;color:var(--accent);margin:15px 0}.explain table{font-size:12px}.explain td,.explain th{padding:7px}.explain td:first-child{min-width:40px}.small{font-size:12px;color:var(--muted)}.lab-foot{border-top:1px solid var(--line);padding:14px 22px;color:var(--muted);font-size:12px}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0}.milestone{border-top:3px solid var(--accent);padding:14px;background:var(--white);border-bottom:1px solid var(--line)}.milestone .year{font:13px ui-monospace,monospace;color:var(--accent)}.milestone b{display:block;margin:7px 0;font-size:16px}.milestone p{margin:0;font-size:12px;color:var(--muted)}.results{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:22px;margin:25px 0}.results img{width:100%;height:auto}.result-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:12px;background:var(--soft);border-radius:6px;font-size:12px}.metric b{display:block;font-size:25px;line-height:1.6}.metric span{color:var(--muted)}.caution{background:#fff1df;padding:15px 18px;border-left:3px solid var(--warm);font-size:13px;margin-top:16px}.confusion{max-width:400px}.references td:first-child{font-size:12px;overflow-wrap:anywhere}footer{padding:35px 5vw;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr;gap:15px}.sidebar{position:static;display:flex;flex-wrap:wrap;gap:6px 18px}.sidebar a{font-size:12px}.hero{padding-top:35px}.lab-body{grid-template-columns:1fr 1fr}.timeline{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){body{font-size:15px}.mast{font-size:10px;padding:14px 20px}.hero{grid-template-columns:1fr;padding:28px 20px}.hero-art{height:150px}.hero h1{font-size:43px}.hero p{font-size:16px}.layout{padding:12px 18px 45px}.lab-body{grid-template-columns:1fr;padding:14px}.timeline{grid-template-columns:1fr 1fr;gap:9px}.milestone{padding:10px}.result-summary{grid-template-columns:1fr 1fr}.results{padding:12px}table{font-size:12px}td,th{padding:8px 5px}h2{font-size:23px}pre{font-size:11px;padding:14px}.table-wrap{overflow-x:auto}article .references{min-width:600px}.controls{gap:9px}}@media print{.sidebar,.mast{display:none}.layout{display:block;padding:0}.hero{padding:0}.lab,.results{break-inside:avoid}h2{break-after:avoid}body{font-size:11px;background:white}a{color:inherit}}
</style>
</head>
<body>
<header class="mast"><a href="../README.md">AI CAPABILITY · LEARNING NOTES</a><span>GRAPH LEARNING / 2026.11.10</span></header>
<section class="hero"><div><div class="eyebrow">A PRACTICAL FIELD GUIDE / 01</div><h1>让模型<br>沿着关系学习。</h1><p>从一条邻居消息，到图神经网络。<br>用原始论文建立脉络，用一个小实验理解结构。</p><div class="pills"><span class="pill">原理交互</span><span class="pill">经典论文原文</span><span class="pill">CPU 训练与评估</span></div></div><svg class="hero-art" viewBox="0 0 400 280" role="img" aria-label="图上的邻居消息汇聚到中心节点"><g stroke="#abc0af" stroke-width="2"><path d="M65 68L185 135L290 45M185 135L335 165M185 135L95 237M185 135L240 248M65 68L290 45M95 237L240 248"/></g><g fill="#d7e5d8"><circle cx="65" cy="68" r="24"/><circle cx="290" cy="45" r="24"/><circle cx="335" cy="165" r="24"/><circle cx="95" cy="237" r="24"/><circle cx="240" cy="248" r="24"/></g><circle cx="185" cy="135" r="45" fill="#12675e"/><g fill="#12675e"><circle cx="123" cy="101" r="5"/><circle cx="238" cy="91" r="5"/><circle cx="260" cy="150" r="5"/><circle cx="142" cy="185" r="5"/></g><text x="185" y="141" text-anchor="middle" fill="white" font-size="19" font-family="monospace">hᵢ′</text></svg></section>
<div class="layout"><nav class="sidebar" aria-label="文章目录">__NAV__</nav><article>__ARTICLE__</article></div>
<footer>原文资料与可复现代码保存在本地学习包中。研究/部署/当前服务状态分开表述。<br>图形、讲解与教学实验为本学习包原创整理；论文版权归原权利人。</footer>
<script src="results.js"></script>
<script>
const lab = document.getElementById('interactive-lab');
lab.innerHTML = `<section class="lab" aria-label="交互式消息传递实验"><div class="lab-top"><h3>亲手传播一条消息</h3><p>点节点，查看它收到什么；逐层传播，观察信息怎样到达远处。</p></div><div class="lab-body"><div><svg class="graph" id="graph" viewBox="0 0 410 300" aria-label="六个节点的可交互图"></svg><div class="controls"><button id="prev" aria-label="上一层">←</button><strong id="layer-label"></strong><button id="next" aria-label="下一层">下一层 →</button><button id="reset">重置</button></div><div class="controls"><label>传播层数 <input id="depth" type="range" min="0" max="8" value="0"></label><label>归一化 <select id="normalization"><option value="gcn">GCN 对称归一化</option><option value="mean">普通均值</option></select></label></div><div class="controls"><label><input type="checkbox" id="self" checked> 自环</label><label><input type="checkbox" id="bridge" checked> 保留 C—E 边</label></div></div><div class="explain" id="explanation" aria-live="polite"></div></div><div class="lab-foot">这里隔离演示传播矩阵：单一标量特征，W=1，σ=恒等函数，没有监督训练。下方 PyTorch Demo 才包含可学习权重、非线性与反向传播。颜色表示当前特征数值，不表示类别或准确率。</div></section>`;
const pts = [[75,65],[205,38],[65,220],[337,80],[205,258],[340,228]];
const baseEdges = [[0,1],[0,2],[1,3],[2,4],[3,5],[4,5]];
const initial = [1,0,0,0,1,0];
let selected=0;
const ns='http://www.w3.org/2000/svg';
function element(tag, attrs){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e;}
function state(){
  const depth=Number(document.getElementById('depth').value);
  const self=document.getElementById('self').checked;
  const edges=baseEdges.filter(([a,b])=>document.getElementById('bridge').checked || !(a===2&&b===4));
  const A=Array.from({length:6},()=>Array(6).fill(0));for(const[a,b]of edges){A[a][b]=1;A[b][a]=1;}if(self)for(let i=0;i<6;i++)A[i][i]=1;
  const d=A.map(row=>row.reduce((a,b)=>a+b,0));
  const mode=document.getElementById('normalization').value;
  const S=A.map((row,i)=>row.map((v,j)=>v?(mode==='gcn'?1/Math.sqrt(d[i]*d[j]):1/d[i]):0));
  let h=initial.slice(), previous=h.slice();
  for(let l=0;l<depth;l++){previous=h.slice();h=S.map(row=>row.reduce((sum,w,j)=>sum+w*previous[j],0));}
  return{depth,edges,A,d,S,h,previous,mode};
}
function render(){
 const s=state(), svg=document.getElementById('graph');svg.replaceChildren();
 for(const[a,b]of s.edges)svg.append(element('line',{x1:pts[a][0],y1:pts[a][1],x2:pts[b][0],y2:pts[b][1],class:'edge'+((a===selected||b===selected)?' active':'')}));
 s.h.forEach((value,i)=>{const g=element('g',{class:'node'+(selected===i?' chosen':''),role:'button',tabindex:'0','aria-label':`选择节点 ${String.fromCharCode(65+i)}`});const v=Math.min(1,Math.max(0,value));g.append(element('circle',{cx:pts[i][0],cy:pts[i][1],r:29,fill:`hsl(155 30% ${94-v*57}%)`}));const t=element('text',{x:pts[i][0],y:pts[i][1]-3,'text-anchor':'middle',fill:v>.6?'white':'#17302f'});t.textContent=String.fromCharCode(65+i);g.append(t);const n=element('text',{x:pts[i][0],y:pts[i][1]+15,'text-anchor':'middle',class:'number',fill:v>.6?'white':'#17302f'});n.textContent=value.toFixed(3);g.append(n);g.addEventListener('click',()=>{selected=i;render()});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=i;render();document.querySelectorAll('.node')[i].focus();}});svg.append(g);});
 document.getElementById('layer-label').textContent=`第 ${s.depth} 层 / 8`;
 document.getElementById('prev').disabled=s.depth===0;document.getElementById('next').disabled=s.depth===8;
 const rows=s.S[selected].map((w,j)=>w?`<tr><td>${String.fromCharCode(65+j)}${j===selected?'（自己）':''}</td><td>${w.toFixed(4)}</td><td>${s.previous[j].toFixed(4)}</td><td>${(w*s.previous[j]).toFixed(4)}</td></tr>`:'').join('');
 document.getElementById('explanation').innerHTML=`<h4>节点 ${String.fromCharCode(65+selected)} · ${s.depth===0?'初始状态':'接收邻居消息'}</h4><p>${s.depth===0?'A 与 E 初值为 1，其余为 0。这些是输入特征，不是标签。按“下一层”开始。':'表内上一层值乘传播权重，再相加，得到当前状态。所有节点同时更新，不按点击顺序更新。'}</p><div class="equation">h${s.depth}(${String.fromCharCode(65+selected)}) = <b id="node-output">${s.h[selected].toFixed(4)}</b></div>${s.depth>0?`<table><thead><tr><th>来源</th><th>权重</th><th>上一层</th><th>贡献</th></tr></thead><tbody>${rows}</tbody></table>`:''}<p class="small">${s.mode==='gcn'?'GCN：权重 = 1/√(dᵢdⱼ)，不一定加起来等于 1。':'均值：权重 = 1/dᵢ，每个接收节点对其邻域求平均。'} ${s.depth>1?'传播多层后可接触多跳信息；有限维聚合也可能丢失差异。':''}</p>`;
}
for(const id of ['depth','self','bridge','normalization'])document.getElementById(id).addEventListener('input',render);
for(const [id,step]of[['next',1],['prev',-1]])document.getElementById(id).onclick=()=>{document.getElementById('depth').value=Number(document.getElementById('depth').value)+step;render();};
document.getElementById('reset').onclick=()=>{document.getElementById('depth').value=0;document.getElementById('self').checked=true;document.getElementById('bridge').checked=true;document.getElementById('normalization').value='gcn';selected=0;render();};render();
const results=document.getElementById('experiment-results');
if(window.GNN_RESULTS){const r=window.GNN_RESULTS;results.innerHTML=`<section class="results"><div class="eyebrow">ACTUAL RUN / ${r.seeds.length} SEEDS / CPU</div><h3>看见结构带来的差异</h3><div class="result-summary">${Object.entries(r.summary).map(([name,m])=>`<div class="metric">${name}<b>${(m.accuracy.mean*100).toFixed(1)}%</b><span>测试均值 ± ${m.accuracy.std===null?'—':(m.accuracy.std*100).toFixed(1)} pp</span></div>`).join('')}</div><p class="small">种子 ${r.seeds.join(' / ')}；标准差为样本标准差。Macro-F1 与逐类混淆矩阵见下表及 results.json。</p><table><thead><tr><th>模型</th><th>Accuracy 均值</th><th>Macro-F1 均值</th></tr></thead><tbody>${Object.entries(r.summary).map(([name,m])=>`<tr><td>${name}</td><td>${m.accuracy.mean.toFixed(4)}</td><td>${m.macro_f1.mean.toFixed(4)}</td></tr>`).join('')}</tbody></table><img src="experiment.png" alt="验证损失、测试准确率、输入与GCN隐藏表示的PCA图"><p class="small">图为第一个种子。PCA 颜色来自真实类别，仅用于可视化，不作为额外模型输入。</p><label>查看测试混淆矩阵 <select id="confusion-select">${r.results.map((v,i)=>`<option value="${i}">${v.name} / seed ${v.seed}</option>`).join('')}</select></label><div id="confusion-matrix" class="confusion"></div><div class="caution">100% 来自刻意设置为同配的简单合成数据。它用于解释机制，不能推断真实数据集或业务收益。当前展示的实验配置：${r.config.layers} 层，p_in=${r.config.p_in}，p_out=${r.config.p_out}，noise=${r.config.noise}。</div><p><a href="results.json">完整指标 JSON</a> · <a href="experiment.svg">矢量图 SVG</a> · <a href="../demo/train.py">训练源码</a></p></section>`;const show=()=>{const v=r.results[Number(document.getElementById('confusion-select').value)];document.getElementById('confusion-matrix').innerHTML=`<p class="small">行 = 真实类别；列 = 预测类别。选中验证损失最小的第 ${v.best_epoch} 轮。</p><table><thead><tr><th>真实 / 预测</th><th>0</th><th>1</th><th>2</th></tr></thead><tbody>${v.confusion.map((row,i)=>`<tr><th>${i}</th>${row.map(n=>`<td>${n}</td>`).join('')}</tr>`).join('')}</tbody></table>`;};document.getElementById('confusion-select').onchange=show;show();}
else results.innerHTML='<p>未找到 results.js；请先运行训练 Demo。</p>';
</script>
</body></html>
